      { "@type": "ListItem", "position": 2, "name": "Member", "item": "https://vapertize.id/member.html" }
    ]
  }
  </script>
</head>
<body>
  <div id="navbarSlot" data-page="member"></div>

  <section class="section">
    <div class="container">
      <div id="memberContent"></div>
    </div>
  </section>

  <div id="footerSlot"></div>
  <div id="cartSlot"></div>

  <script src="assets/js/data.js?v=30"></script>
  <script src="assets/js/app.js?v=30"></script>
  <script>
    function renderAuth() {
      document.getElementById('memberContent').innerHTML = `
        <div class="auth-layout">
          <div class="auth-visual">
            <div class="auth-visual-content">
              <span class="section-eyebrow">★ Vapertize Loyalty Club</span>
              <h2>Join the Club</h2>
              <p>Daftar member Vapertize sekarang dan nikmati benefit eksklusif yang hanya untuk member.</p>
              <ul class="perks">
                <li>100 poin gratis saat daftar</li>
                <li>Kumpulkan poin setiap belanja</li>
                <li>5 tier reward: SPARK → VAPE GOD</li>
                <li>Cashback hingga Rp 120.000</li>
                <li>Special discount langsung tiap pembelian</li>
                <li>Akses promo & event eksklusif</li>
              </ul>
            </div>
            <div style="font-size:13px;color:var(--text-muted);margin-top:24px">
              Sudah dipercaya oleh 500+ vaper di Pasuruan & sekitarnya
            </div>
          </div>
          <div class="auth-form">
            <div class="auth-tabs">
              <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">Login</button>
              <button class="auth-tab" data-tab="register" onclick="switchTab('register')">Register</button>
            </div>

            <div id="loginForm">
              <h3>Welcome Back</h3>
              <p class="subtitle">Masuk untuk cek poin dan riwayat order kamu</p>
              <form onsubmit="return handleLogin(event)">
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-input" id="loginEmail" required placeholder="kamu@email.com">
                </div>
                <div class="form-group">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-input" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
              </form>
              <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
                Belum punya akun? <a href="#" onclick="switchTab('register');return false" style="color:var(--accent)">Daftar di sini</a>
              </p>
            </div>

            <div id="registerForm" style="display:none">
              <h3>Create Account</h3>
              <p class="subtitle">Daftar gratis & dapatkan 100 poin pendaftaran</p>
              <form onsubmit="return handleRegister(event)">
                <div class="form-group">
                  <label class="form-label">Nama Lengkap</label>
                  <input type="text" class="form-input" id="regName" required placeholder="Nama lengkap">
                </div>
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-input" id="regEmail" required placeholder="kamu@email.com">
                </div>
                <div class="form-group">
                  <label class="form-label">No. WhatsApp</label>
                  <input type="tel" class="form-input" id="regPhone" required placeholder="08xxxxxxxxxx">
                </div>
                <div class="form-group">
                  <label class="form-label">Tanggal Lahir <span style="font-weight:400;color:var(--text-muted);font-size:12px">(dapat bonus 200 poin tiap ultah 🎂)</span></label>
                  <input type="date" class="form-input" id="regBirthday" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-input" id="regPassword" required placeholder="Min. 6 karakter" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Daftar Sekarang</button>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const result = loginUser(email, password);
      if (!result.ok) {
        showToast(result.msg, 'error');
        return false;
      }
      showToast(`Selamat datang, ${result.user.name}!`, 'success');
      setTimeout(() => location.reload(), 800);
      return false;
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const birthday = document.getElementById('regBirthday').value;
      const password = document.getElementById('regPassword').value;
      const result = registerUser(name, email, phone, password);
      if (!result.ok) {
        showToast(result.msg, 'error');
        return false;
      }
      // Save birthday to user record
      const users = getUsers();
      const idx = users.findIndex(u => u.id === result.user.id);
      if (idx >= 0) {
        users[idx].birthday = birthday;
        saveUsers(users);
      }
      showToast(`Registrasi berhasil! +100 poin bonus`, 'success');
      setTimeout(() => location.reload(), 800);
      return false;
    }

    function renderDashboard(user) {
      // 1. Check birthday — award bonus if today is user's birthday
      const bdayBonus = checkBirthdayBonus();
      if (bdayBonus) {
        // refresh user data after bonus
        user = getCurrentUser();
        setTimeout(() => showToast(`🎂 Happy Birthday! +${bdayBonus.points} poin bonus!`, 'success'), 500);
      }

      const tier = getUserTier(user.points);
      const orderCount = user.history.filter(h => h.type === 'add').length;

      // Check-in status
      const ci = checkinStatus(user);
      const today = todayDateStr();
      const isBirthdayToday = user.birthday && (() => {
        const t = new Date();
        const md = `${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
        return user.birthday.substring(5) === md;
      })();

      // Sort history newest first
      const history = [...user.history].sort((a, b) => new Date(b.date) - new Date(a.date));

      // Wishlist
      const wishlistProducts = typeof getWishlistProducts === 'function' ? getWishlistProducts() : [];

      document.getElementById('memberContent').innerHTML = `
        <div class="dashboard">
          <aside class="dash-sidebar">
            <div class="user-avatar">${user.name.charAt(0).toUpperCase()}</div>
            <div class="user-name">${user.name}</div>
            <div class="user-email">${user.email}</div>
            <ul class="dash-menu">
              <li><a href="#" class="active">📊 Dashboard</a></li>
              <li><a href="#poin">⭐ Poin & Reward</a></li>
              <li><a href="#wishlist">❤️ Wishlist (${wishlistProducts.length})</a></li>
              <li><a href="#history">📜 Riwayat</a></li>
              <li><a href="catalog.html">🛍 Belanja</a></li>
              <li><a href="contact.html">💬 Bantuan</a></li>
              <li><a href="#" onclick="logout();return false" style="color:var(--danger)">🚪 Logout</a></li>
            </ul>
          </aside>

          <div class="dash-content">
            ${isBirthdayToday ? `
            <div class="birthday-banner">
              <div class="birthday-icon">🎂</div>
              <div class="birthday-text">
                <h3>Happy Birthday, ${user.name.split(' ')[0]}!</h3>
                <p>Kamu dapat <strong>+200 poin bonus</strong> dari Vapertize. Semoga sehat & cuannya banyak!</p>
              </div>
            </div>` : ''}

            <!-- Daily Check-in -->
            <div class="checkin-card">
              <div class="checkin-info">
                ${ci.streak > 0 ? `<span class="checkin-streak">🔥 ${ci.streak} hari streak</span>` : ''}
                <div class="checkin-title">${ci.canCheckIn ? 'Check-in Hari Ini' : 'Sudah Check-in Hari Ini ✓'}</div>
                <div class="checkin-sub">${ci.canCheckIn ? 'Dapatkan 5 poin gratis tiap hari. Streak 7 hari = bonus +50 poin!' : 'Balik lagi besok untuk lanjutkan streak. Jangan sampai putus ya!'}</div>
              </div>
              <button class="checkin-btn" onclick="handleCheckin()" ${ci.canCheckIn ? '' : 'disabled'}>
                ${ci.canCheckIn ? '⭐ Check-in (+5 poin)' : '✓ Sudah Check-in'}
              </button>
            </div>

            <!-- Point Card -->
            <div class="point-card">
              <div class="point-label">Total Poin Kamu</div>
              <div class="point-value">${user.points.toLocaleString()}</div>
              <div class="point-tier">⭐ ${tier} Member</div>
              <div style="margin-top:12px;font-size:13px;opacity:0.8">
                Member sejak ${new Date(user.joinDate).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}
              </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
              <div class="stat-card">
                <div class="label">Total Order</div>
                <div class="value">${orderCount}</div>
              </div>
              <div class="stat-card">
                <div class="label">Reward Diklaim</div>
                <div class="value">${user.history.filter(h => h.type === 'use').length}</div>
              </div>
              <div class="stat-card">
                <div class="label">Tier Status</div>
                <div class="value">${tier}</div>
              </div>
            </div>

            <!-- Loyalty Club teaser -->
            <div class="dash-card loyalty-teaser" id="poin">
              <div class="loyalty-header">
                <div class="loyalty-eyebrow">VAPERTIZE LOYALTY CLUB</div>
                <h3 class="loyalty-headline">Cashback hingga <span class="gold-text">Rp 120.000</span></h3>
                <p class="loyalty-tagline"><em>Every Puff Counts.</em> Naik Level, Raih Lebih, Nikmati Lebih.</p>
              </div>
              <div class="loyalty-tiers">
                <div class="loyalty-tier tier-spark">
                  <div class="tier-emblem"><svg viewBox="0 0 64 56" width="44" height="38" aria-hidden="true"><polygon points="16,0 48,0 64,28 48,56 16,56 0,28" fill="currentColor"/><polygon points="22,8 42,8 54,28 42,48 22,48 10,28" fill="rgba(0,0,0,0.25)"/></svg></div>
                  <div class="tier-name">SPARK</div>
                </div>
                <div class="loyalty-tier tier-boost">
                  <div class="tier-emblem"><svg viewBox="0 0 64 56" width="44" height="38" aria-hidden="true"><polygon points="16,0 48,0 64,28 48,56 16,56 0,28" fill="currentColor"/><polygon points="22,8 42,8 54,28 42,48 22,48 10,28" fill="rgba(0,0,0,0.25)"/></svg></div>
                  <div class="tier-name">BOOST</div>
                </div>
                <div class="loyalty-tier tier-ignite">
                  <div class="tier-emblem"><svg viewBox="0 0 64 56" width="44" height="38" aria-hidden="true"><polygon points="16,0 48,0 64,28 48,56 16,56 0,28" fill="currentColor"/><polygon points="22,8 42,8 54,28 42,48 22,48 10,28" fill="rgba(0,0,0,0.25)"/></svg></div>
                  <div class="tier-name">IGNITE</div>
                </div>
                <div class="loyalty-tier tier-legend">
                  <div class="tier-emblem"><svg viewBox="0 0 64 56" width="44" height="38" aria-hidden="true"><polygon points="16,0 48,0 64,28 48,56 16,56 0,28" fill="currentColor"/><polygon points="22,8 42,8 54,28 42,48 22,48 10,28" fill="rgba(0,0,0,0.25)"/></svg></div>
                  <div class="tier-name">LEGEND</div>
                </div>
                <div class="loyalty-tier tier-vape-god">
                  <div class="tier-emblem"><svg viewBox="0 0 64 56" width="44" height="38" aria-hidden="true"><polygon points="16,0 48,0 64,28 48,56 16,56 0,28" fill="currentColor"/><polygon points="22,8 42,8 54,28 42,48 22,48 10,28" fill="rgba(0,0,0,0.25)"/></svg></div>
                  <div class="tier-name">VAPE GOD</div>
                </div>
              </div>
              <div class="loyalty-cta">
                <p class="loyalty-note">Status tier kamu sekarang: <strong class="gold-text">${tier}</strong>. Tukar cashback di kasir Vapertize Bangil / Pandaan saat belanja. <strong>+</strong> Special Discount Langsung tiap pembelian.</p>
                <a href="https://wa.me/628137000110?text=Halo%20Risa%2C%20saya%20mau%20tanya%20detail%20Vapertize%20Loyalty%20Club" target="_blank" rel="noopener" class="btn btn-whatsapp btn-sm">💬 Tanya Detail ke Risa</a>
              </div>
            </div>

            <!-- Wishlist -->
            <div class="dash-card wishlist-section" id="wishlist">
              <h3>❤️ Wishlist Saya (${wishlistProducts.length})</h3>
              ${wishlistProducts.length === 0 ? `
                <div class="wishlist-empty">
                  Belum ada produk di wishlist.<br>
                  <a href="catalog.html">Mulai jelajahi katalog →</a>
                </div>
              ` : `
                <div class="wishlist-grid">
                  ${wishlistProducts.map(p => `
                    <div class="wishlist-item">
                      <button class="wishlist-item-remove" onclick="removeFromWishlist('${p.id}')" title="Hapus">×</button>
                      <div class="wishlist-item-icon">${p.icon || '📦'}</div>
                      <div class="wishlist-item-name">${p.name}</div>
                      <div class="wishlist-item-price">${formatRupiah(p.price)}</div>
                      <button class="btn btn-whatsapp btn-sm btn-block" style="margin-top:10px" onclick="orderProductWA('${p.id}')">💬 Order via WA</button>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- History -->
            <div class="dash-card" id="history">
              <h3>📜 Riwayat Poin</h3>
              ${history.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:20px">Belum ada riwayat</p>' :
                history.map(h => `
                  <div class="history-item">
                    <div class="history-icon">${h.type === 'add' ? '➕' : '🎁'}</div>
                    <div class="history-info">
                      <div class="history-title">${h.title}</div>
                      <div class="history-date">${new Date(h.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                    <div class="history-point ${h.type}">${h.type === 'add' ? '+' : '-'}${h.points}</div>
                  </div>
                `).join('')
              }
            </div>
          </div>
        </div>
      `;
    }

    function claimReward(name, cost) {
      const user = getCurrentUser();
      if (!user || user.points < cost) return;
      if (!confirm(`Tukar ${cost} poin untuk "${name}"?`)) return;

      const users = getUsers();
      const idx = users.findIndex(u => u.id === user.id);
      users[idx].points -= cost;
      users[idx].history.unshift({
        type: 'use',
        title: `Tukar reward: ${name}`,
        date: new Date().toISOString(),
        points: cost
      });
      saveUsers(users);
      showToast(`Reward berhasil ditukar! Cek WA untuk klaim.`, 'success');
      renderDashboard(users[idx]);
    }

    function handleCheckin() {
      const r = doDailyCheckIn();
      if (!r.ok) {
        showToast(r.msg, 'error');
        return;
      }
      showToast(`✓ Check-in berhasil! +${r.points} poin${r.bonusMsg || ''}`, 'success');
      setTimeout(() => renderDashboard(getCurrentUser()), 500);
    }

    function removeFromWishlist(id) {
      toggleWishlist(id);
      showToast('Dihapus dari wishlist', 'info');
      renderDashboard(getCurrentUser());
    }

    function pageInit() {
      const user = getCurrentUser();
      if (user) {
        renderDashboard(user);
      } else {
        renderAuth();
      }
    }
  </script>
</body>
</html>
