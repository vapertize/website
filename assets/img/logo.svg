<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8"/>
      <stop offset="20%" stop-color="#F2D27A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#9B7820"/>
      <stop offset="100%" stop-color="#6B5212"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89F"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="vBase" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F2D27A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="metallic" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.8" specularExponent="25" lighting-color="#FFF8DC" result="spec">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#metallic)">
    <!-- LEFT ANTLER: main curving trunk with tines -->
    <!-- Main trunk left, curves from V base outward & upward -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 120 200
      C 118 185, 110 170, 102 155
      C 95 140, 88 125, 82 110
      C 78 100, 75 90, 75 82
      L 82 78
      C 84 86, 88 96, 92 106
      C 96 116, 102 128, 106 138
      C 110 148, 114 158, 118 168
      Z"/>

    <!-- Left antler: tine 1 (lowest, going slightly outward) -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 95 132
      C 85 128, 72 124, 60 122
      C 50 121, 42 122, 38 124
      L 36 118
      C 42 114, 52 112, 64 113
      C 76 114, 88 118, 98 124
      Z"/>

    <!-- Left antler: tine 2 (middle, curving up and out) -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 88 108
      C 76 102, 60 94, 48 84
      C 40 78, 34 70, 30 62
      L 36 58
      C 42 64, 50 72, 58 78
      C 68 86, 80 94, 92 102
      Z"/>

    <!-- Left antler: tine 3 (upper, going up) -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 80 88
      C 72 78, 64 64, 58 50
      C 54 40, 52 30, 52 22
      L 60 22
      C 62 32, 66 44, 72 56
      C 76 66, 82 76, 86 84
      Z"/>

    <!-- Left antler: tine 4 (highest, sharp tip) -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 75 72
      C 70 60, 66 46, 64 32
      C 63 24, 64 16, 66 10
      L 73 12
      C 73 20, 74 30, 76 40
      C 78 50, 80 60, 82 68
      Z"/>

    <!-- RIGHT ANTLER: mirror of left -->
    <!-- Main trunk right -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 120 200
      C 122 185, 130 170, 138 155
      C 145 140, 152 125, 158 110
      C 162 100, 165 90, 165 82
      L 158 78
      C 156 86, 152 96, 148 106
      C 144 116, 138 128, 134 138
      C 130 148, 126 158, 122 168
      Z"/>

    <!-- Right antler: tine 1 -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 145 132
      C 155 128, 168 124, 180 122
      C 190 121, 198 122, 202 124
      L 204 118
      C 198 114, 188 112, 176 113
      C 164 114, 152 118, 142 124
      Z"/>

    <!-- Right antler: tine 2 -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 152 108
      C 164 102, 180 94, 192 84
      C 200 78, 206 70, 210 62
      L 204 58
      C 198 64, 190 72, 182 78
      C 172 86, 160 94, 148 102
      Z"/>

    <!-- Right antler: tine 3 -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 160 88
      C 168 78, 176 64, 182 50
      C 186 40, 188 30, 188 22
      L 180 22
      C 178 32, 174 44, 168 56
      C 164 66, 158 76, 154 84
      Z"/>

    <!-- Right antler: tine 4 -->
    <path fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 165 72
      C 170 60, 174 46, 176 32
      C 177 24, 176 16, 174 10
      L 167 12
      C 167 20, 166 30, 164 40
      C 162 50, 160 60, 158 68
      Z"/>

    <!-- CENTRAL V BASE -->
    <path fill="url(#vBase)" stroke="url(#goldEdge)" stroke-width="0.5" d="
      M 78 168
      L 95 168
      L 120 220
      L 145 168
      L 162 168
      L 120 235
      Z"/>
  </g>

  <!-- Highlight overlay for metallic shine -->
  <g opacity="0.45">
    <path fill="#FFF8DC" d="
      M 120 200
      C 118 185, 110 170, 102 155
      L 105 160
      C 110 175, 115 190, 118 200
      Z"/>
    <path fill="#FFF8DC" d="
      M 120 200
      L 122 200
      L 120 230
      L 118 200 Z"/>
  </g>
</svg>
