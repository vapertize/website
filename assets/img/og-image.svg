<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D78B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Logo (left side) -->
  <g transform="translate(180, 145) scale(1.7)" fill="url(#goldG)">
    <path d="M 100 175 L 75 110 L 88 105 L 100 145 L 112 105 L 125 110 Z"/>
    <path d="M 75 110 L 65 85 L 50 80 L 55 65 L 40 60 L 45 45 L 30 35 L 35 25 L 50 35 L 48 50 L 60 50 L 58 65 L 70 70 L 72 88 L 85 95 Z"/>
    <path d="M 50 80 L 35 70 L 30 55 L 38 60 L 42 75 Z"/>
    <path d="M 55 65 L 42 50 L 38 35 L 48 42 L 52 58 Z"/>
    <path d="M 125 110 L 135 85 L 150 80 L 145 65 L 160 60 L 155 45 L 170 35 L 165 25 L 150 35 L 152 50 L 140 50 L 142 65 L 130 70 L 128 88 L 115 95 Z"/>
    <path d="M 150 80 L 165 70 L 170 55 L 162 60 L 158 75 Z"/>
    <path d="M 145 65 L 158 50 L 162 35 L 152 42 L 148 58 Z"/>
  </g>

  <!-- Text (right side) -->
  <text x="640" y="280" font-family="Impact, 'Bebas Neue', sans-serif" font-size="110" font-weight="900" fill="url(#goldG)" letter-spacing="6">VAPERTIZE</text>
  <text x="640" y="335" font-family="Inter, sans-serif" font-size="28" fill="#b0b0b0" letter-spacing="3">AUTHENTIC &amp; PREMIUM VAPE STORE</text>

  <!-- Divider line -->
  <line x1="640" y1="370" x2="1020" y2="370" stroke="url(#goldG)" stroke-width="2"/>

  <!-- Description -->
  <text x="640" y="420" font-family="Inter, sans-serif" font-size="26" fill="#ffffff">Distributor &amp; Toko Vape Premium</text>
  <text x="640" y="455" font-family="Inter, sans-serif" font-size="22" fill="#b0b0b0">📍 Bangil &amp; Pandaan, Pasuruan · 🕐 08.00 - 22.00 WIB</text>

  <!-- Bottom badge -->
  <g transform="translate(640, 510)">
    <rect width="200" height="50" rx="25" fill="#D4AF37"/>
    <text x="100" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#000">vapertize.pages.dev</text>
  </g>

  <!-- 21+ badge -->
  <g transform="translate(1050, 540)">
    <circle cx="40" cy="40" r="40" fill="#D94f4f"/>
    <text x="40" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#fff">21+</text>
  </g>
