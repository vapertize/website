<body>

        <button class="filter-chip" data-cat="cartridge-cotton">🧵 Cartridge &amp; Cotton</button>

          <input type="text" id="searchInput" placeholder="Cari produk...">
        </div>
      </div>

      <!-- Product Grid -->

      <div id="emptyState" style="display:none" class="empty-state">
        <div class="icon">🔍</div>

  <script src="assets/js/data.js?v=19"></script>
  <script src="assets/js/app.js?v=19"></script>
  <script>
    let currentCat = 'all';
    let searchQuery = '';
    let currentPage = 1;
    const PER_PAGE = 24; // 6 rows x 4 cols on desktop

    function renderProducts() {
      let items = getProductsByCat(currentCat);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        items = items.filter(p =>
          (p.name || '').toLowerCase().includes(q) ||
          (p.desc || '').toLowerCase().includes(q) ||
          (p.brand || '').toLowerCase().includes(q)
        );
      }

      const grid = document.getElementById('productGrid');
      const empty = document.getElementById('emptyState');
      const meta = document.getElementById('productMeta');
      const pagNav = document.getElementById('pagination');

      // Compute pagination
      const totalPages = Math.max(1, Math.ceil(items.length / PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const start = (currentPage - 1) * PER_PAGE;
      const end = Math.min(start + PER_PAGE, items.length);
      const pageItems = items.slice(start, end);

      // Update meta info
      const branch = getCurrentBranch();
      const branchLabel = branch === 'all' ? 'semua cabang' : branch.charAt(0).toUpperCase()+branch.slice(1);
      if (items.length === 0) {
        meta.textContent = `Tidak ada produk di ${branchLabel}`;
      } else {
        meta.textContent = `${start+1}-${end} dari ${items.length} produk di ${branchLabel}`;
      }

      if (items.length === 0) {
        grid.innerHTML = '';
        pagNav.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = pageItems.map(p => {
        const isBundle = productCat(p) === 'bundle';
        const stockBangil = p.stock?.bangil || 0;
        const stockPandaan = p.stock?.pandaan || 0;
        const totalStock = stockBangil + stockPandaan;
        const stockBadge = (isBundle || totalStock > 0) ? '' : `<span class="product-tag" style="background:#D94f4f;color:#fff">HABIS</span>`;

        // Stock urgency badge (only for non-bundles with low stock)
        let urgencyBadge = '';
        if (!isBundle && totalStock > 0 && totalStock <= 3) {
          urgencyBadge = `<span class="stock-urgent">🔥 Tersisa ${totalStock}</span>`;
        }

        // Wishlist heart state
        const wishActive = isInWishlist(p.id) ? 'active' : '';
        const wishIcon = isInWishlist(p.id) ? '♥' : '♡';

        return `
        <div class="product-card ${isBundle ? 'is-bundle' : ''}">
          ${isBundle ? '<span class="bundle-badge">★ PAKET HEMAT</span>' : ''}
          <button class="wish-btn ${wishActive}" onclick="handleWishToggle('${p.id}', this)" aria-label="Wishlist">${wishIcon}</button>
          <div class="product-img">
            ${p.tag ? `<span class="product-tag ${p.tag}">${p.tag}</span>` : stockBadge}
            ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy" style="width:100%;height:100%;object-fit:contain;padding:20px">` : (p.icon || '📦')}
          </div>
          <div class="product-info">
            <div class="product-cat">${p.brand || ''} · ${isBundle ? 'Bundle' : productCat(p)}</div>
            ${isBundle ? `<div class="product-name">${p.name}</div>` : `<a href="/p/${p.id}.html" class="product-name" style="color:inherit;text-decoration:none">${p.name}</a>`}
            ${p.desc ? `<div class="product-desc">${p.desc}</div>` : ''}
            ${urgencyBadge ? `<div style="margin-bottom:8px">${urgencyBadge}</div>` : ''}
            ${isBundle && p.bundleItems ? `
              <ul class="bundle-items">
                ${p.bundleItems.map(i => `<li>${i}</li>`).join('')}
              </ul>
            ` : `
            <div class="product-stock" style="font-size:12px;color:var(--text-muted);margin-bottom:8px">
              <span style="color:${stockBangil>0?'var(--success)':'#D94f4f'};font-weight:600">Bangil: ${stockBangil>0?'✓ Ready':'✗ Habis'}</span> ·
              <span style="color:${stockPandaan>0?'var(--success)':'#D94f4f'};font-weight:600">Pandaan: ${stockPandaan>0?'✓ Ready':'✗ Habis'}</span>
            </div>
            `}
            <div class="product-bottom">
              <div class="product-price">
                ${p.oldPrice ? `<span class="old">${formatRupiah(p.oldPrice)}</span>` : ''}
                ${formatRupiah(p.price)}
              </div>
              <button class="add-cart-btn" onclick="addToCart('${p.id}')" title="Tambah ke keranjang">+</button>
            </div>
            ${(!isBundle && totalStock === 0) ? `
              <button class="btn btn-secondary btn-sm btn-block" style="margin-top:10px" onclick="openRestockModal('${p.id}', \`${(p.name||'').replace(/`/g,'\\\\`')}\`)">
                🔔 Beritahu Saya Saat Ready
              </button>
            ` : `
              <button class="btn btn-whatsapp btn-sm btn-block" style="margin-top:10px" onclick="orderProductWA('${p.id}')">
                💬 Order Cepat WA
              </button>
            `}
          </div>
        </div>
      `}).join('');

      // Render pagination
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pagNav = document.getElementById('pagination');
      if (totalPages <= 1) { pagNav.innerHTML = ''; return; }

      // Smart page list: 1, ..., current-1, current, current+1, ..., last
      const pages = [];
      const add = (p) => pages.push(p);
      const addDots = () => pages.push('...');

      add(1);
      if (currentPage > 4) addDots();
      for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) add(i);
      if (currentPage < totalPages - 3) addDots();
      if (totalPages > 1) add(totalPages);

      const prevDisabled = currentPage === 1;
      const nextDisabled = currentPage === totalPages;

      pagNav.innerHTML = `
        <button class="pag-btn pag-nav" ${prevDisabled?'disabled':''} onclick="goToPage(${currentPage-1})" aria-label="Halaman sebelumnya">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Prev</span>
        </button>
        ${pages.map(p => p === '...'
          ? `<span class="pag-dots">…</span>`
          : `<button class="pag-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`
        ).join('')}
        <button class="pag-btn pag-nav" ${nextDisabled?'disabled':''} onclick="goToPage(${currentPage+1})" aria-label="Halaman berikutnya">
          <span>Next</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      `;
    }

    function goToPage(p) {
      currentPage = p;
      const url = new URL(window.location);
      if (p === 1) url.searchParams.delete('page');
      else url.searchParams.set('page', p);
      window.history.replaceState({}, '', url);
      renderProducts();
      // Smooth scroll to top of grid
      document.querySelector('.filter-bar').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Wishlist toggle handler (uses data.js helpers)
    function handleWishToggle(id, btn) {
      const added = toggleWishlist(id);
      btn.classList.toggle('active', added);
      btn.textContent = added ? '♥' : '♡';
      showToast(added ? '❤️ Ditambahkan ke wishlist' : 'Dihapus dari wishlist', added ? 'success' : 'info');
    }

    function pageInit() {
      // Read URL params
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat');
      const page = parseInt(params.get('page'));
      if (cat) {
        currentCat = cat;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
      }
      if (page && page > 0) currentPage = page;

      // Init branch picker state from localStorage
      const currentBranch = getCurrentBranch();
      document.querySelectorAll('.branch-chip').forEach(c => c.classList.toggle('active', c.dataset.branch === currentBranch));

      renderProducts();

      // Branch picker clicks
      document.querySelectorAll('.branch-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.branch-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          setCurrentBranch(chip.dataset.branch);
          resetPageAndRender();
        });
      });

      // Filter clicks
      document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentCat = chip.dataset.cat;
          resetPageAndRender();
        });
      });

      // Search (debounced for perf with 800+ products)
      let searchTimer;
      document.getElementById('searchInput').addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          searchQuery = e.target.value;
          resetPageAndRender();
        }, 200);
      });
    }

    function resetPageAndRender() {
      currentPage = 1;
      const url = new URL(window.location);
      url.searchParams.delete('page');
      window.history.replaceState({}, '', url);
      renderProducts();
    }
  </script>
